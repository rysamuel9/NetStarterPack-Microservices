<p style="margin:0 0 12px 0;">Halo <strong>{{ recipient_name }}</strong>,</p>
<p style="margin:0 0 16px 0;">Kabar baik! Pengajuan dokumen kamu telah <strong style="color:#059669;">Disetujui</strong>.</p>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ECFDF5; border:1px solid #A7F3D0; border-radius:8px; margin:16px 0;">
  <tr><td style="padding:10px 14px; font-size:13px; color:#065F46; width:38%;">No. Dokumen</td><td style="padding:10px 14px; font-size:13px; color:#064E3B;"><strong>{{ document_number }}</strong></td></tr>
  <tr><td style="padding:10px 14px; font-size:13px; color:#065F46; border-top:1px solid #A7F3D0;">Jenis Form</td><td style="padding:10px 14px; font-size:13px; color:#064E3B; border-top:1px solid #A7F3D0;">{{ form_name }}</td></tr>
  <tr><td style="padding:10px 14px; font-size:13px; color:#065F46; border-top:1px solid #A7F3D0;">Disetujui oleh</td><td style="padding:10px 14px; font-size:13px; color:#064E3B; border-top:1px solid #A7F3D0;">{{ actor_name }} ({{ step_name }})</td></tr>
  <tr><td style="padding:10px 14px; font-size:13px; color:#065F46; border-top:1px solid #A7F3D0;">Status Sekarang</td><td style="padding:10px 14px; font-size:13px; color:#064E3B; border-top:1px solid #A7F3D0;"><strong>{{ status_label }}</strong></td></tr>
</table>

{{ if notes && notes != "" }}
<div style="background:#F8FAFC; border-left:4px solid #10B981; padding:12px 14px; margin:16px 0; border-radius:4px;">
  <strong style="color:#0F172A;">Catatan Approver:</strong><br />
  <span style="color:#334155;">{{ notes }}</span>
</div>
{{ end }}
